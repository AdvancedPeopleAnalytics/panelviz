# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Builds the pkgdown site and deploys it to the gh-pages branch, which GitHub
# Pages serves at https://advancedpeopleanalytics.github.io/panelviz/.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Don't cancel an in-flight deploy because a PR was updated, but DO cancel
    # an older build of the same PR.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' && 'deploy' || github.event.pull_request.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Keep repository notes off the site
        # pkgdown renders every top-level .md file as a page, which would publish
        # MEMORY.md. Remove the copies it makes; move the file out of the package
        # root if this ever covers anything else.
        run: rm -f docs/MEMORY.html docs/MEMORY.md

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
